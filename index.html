<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Catálogo Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* ======================================================================
   ⚙️  CONFIGURACIÓN — LO ÚNICO QUE PEDRO TIENE QUE TOCAR PARA CADA COMERCIO
   Buscá el bloque "CONFIGURACIÓN" más abajo en la etiqueta <script>.
   Acá arriba solo hay estilos visuales.
   ====================================================================== */

:root{
  --verde-hoja:#1F5C4F;
  --verde-oscuro:#123B32;
  --crema:#F6F7F1;
  --papel:#FFFFFF;
  --coral:#E4572E;
  --coral-oscuro:#C64620;
  --linea:#E1E4DC;
  --texto:#1B2420;
  --texto-suave:#5B6560;
}

*{box-sizing:border-box; margin:0; padding:0;}

html{
  background:var(--crema);
}

body{
  background:var(--crema);
  color:var(--texto);
  font-family:'Karla', system-ui, sans-serif;
  line-height:1.5;
  padding-bottom:60px;
}

h1,h2,h3, .num{
  font-family:'Sora', system-ui, sans-serif;
}

/* ---------- Encabezado ---------- */

header.tienda{
  background:var(--verde-hoja);
  color:var(--crema);
  padding:28px 20px 34px;
  position:relative;
  overflow:hidden;
}

header.tienda::after{
  content:"";
  position:absolute;
  right:-40px; top:-60px;
  width:220px; height:220px;
  border-radius:50%;
  background:var(--verde-oscuro);
  opacity:.55;
}

.header-inner{
  max-width:900px;
  margin:0 auto;
  position:relative;
  z-index:1;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
}

.marca h1{
  font-size:28px;
  font-weight:800;
  letter-spacing:-0.01em;
}

.marca p{
  margin-top:6px;
  font-size:14.5px;
  color:#D7E6DF;
  max-width:420px;
}

.info-envio{
  margin-top:20px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.chip{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.25);
  color:var(--crema);
  font-size:12.5px;
  padding:6px 12px;
  border-radius:20px;
}

.chip-cerrado{
  background:rgba(228,87,46,.25);
  border-color:rgba(228,87,46,.6);
}

.chip-clickeable{
  cursor:pointer;
}
.chip-clickeable::after{
  content:" ▾";
  font-size:10px;
}

.detalle-horario{
  display:none;
  max-width:900px;
  margin:10px auto 0;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  border-radius:10px;
  padding:10px 14px;
}
.detalle-horario.abierto{ display:block; }

.fila-horario{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:12.5px;
  color:var(--crema);
  padding:3px 0;
}
.fila-horario span:first-child{ font-weight:700; }
.fila-horario span:last-child{ color:#D7E6DF; text-align:right; }

/* ---------- Carrito flotante al scrollear ---------- */

/* ---------- Aviso de "actualizando stock" ---------- */

.aviso-cargando-stock{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%) translateY(-14px);
  background:var(--verde-oscuro);
  color:white;
  font-size:12px;
  font-weight:600;
  padding:7px 14px;
  border-radius:20px;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
  z-index:30;
  box-shadow:0 4px 10px rgba(0,0,0,.2);
}
.aviso-cargando-stock.visible{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.fab-carrito{
  position:fixed;
  right:18px;
  bottom:18px;
  background:var(--coral);
  color:white;
  border:none;
  border-radius:50%;
  width:56px;
  height:56px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  box-shadow:0 6px 16px rgba(18,26,22,.28);
  cursor:pointer;
  z-index:15;
  opacity:0;
  transform:translateY(14px);
  pointer-events:none;
  transition:opacity .2s ease, transform .2s ease, background .15s ease;
}
.fab-carrito.visible{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}
.fab-carrito:hover{ background:var(--coral-oscuro); }

.fab-badge{
  position:absolute;
  top:-4px; right:-4px;
  background:white;
  color:var(--coral-oscuro);
  font-weight:800;
  font-size:11px;
  min-width:20px;
  height:20px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 4px;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}

/* ---------- Botón carrito flotante en el header ---------- */

.btn-carrito{
  background:var(--coral);
  color:white;
  border:none;
  border-radius:14px;
  padding:10px 16px;
  font-family:'Karla', sans-serif;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
  transition:transform .15s ease, background .15s ease;
}
.btn-carrito:hover{ background:var(--coral-oscuro); }
.btn-carrito:active{ transform:scale(.96); }

.badge{
  background:white;
  color:var(--coral-oscuro);
  font-weight:800;
  font-size:12px;
  min-width:20px;
  height:20px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 5px;
}

@keyframes pulsoContador{
  0%{ transform:scale(1); }
  35%{ transform:scale(1.4); }
  100%{ transform:scale(1); }
}
.badge.pulso, .fab-badge.pulso{
  animation:pulsoContador .35s ease;
}

/* ---------- Buscador ---------- */

.buscador-wrap{
  max-width:900px;
  margin:18px auto 0;
  padding:0 20px;
}

.buscador-wrap input{
  width:100%;
  border:1px solid var(--linea);
  background:var(--papel);
  border-radius:12px;
  padding:11px 14px;
  font-family:'Karla', sans-serif;
  font-size:14px;
  color:var(--texto);
}
.buscador-wrap input:focus{
  outline:none;
  border-color:var(--verde-hoja);
}

/* ---------- Categorías ---------- */

.categorias{
  max-width:900px;
  margin:22px auto 0;
  padding:0 20px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}
.categorias::-webkit-scrollbar{display:none;}

.cat-btn{
  border:1px solid var(--linea);
  background:var(--papel);
  color:var(--texto-suave);
  padding:8px 16px;
  border-radius:20px;
  font-size:13.5px;
  font-weight:600;
  white-space:nowrap;
  cursor:pointer;
  transition:all .15s ease;
}
.cat-btn.activo{
  background:var(--verde-hoja);
  border-color:var(--verde-hoja);
  color:white;
}

/* ---------- Grilla de productos ---------- */

main{
  max-width:900px;
  margin:22px auto 0;
  padding:0 20px;
}

.grilla{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(200px,1fr));
  gap:16px;
  margin-top:16px;
}

.sin-resultados{
  grid-column:1/-1;
  text-align:center;
  color:var(--texto-suave);
  font-size:14px;
  padding:30px 10px;
}

@media (max-width:600px){
  .grilla{
    grid-template-columns:repeat(2, 1fr);
    gap:10px;
  }
  .foto-producto{ font-size:34px; }
  .datos-producto{ padding:10px; }
  .nombre-producto{ font-size:13px; }
  .precio{ font-size:15px; }
  .btn-agregar{ padding:6px 10px; font-size:12px; }
}

.producto{
  background:var(--papel);
  border:1px solid var(--linea);
  border-radius:16px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.foto-producto{
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
  background:var(--crema);
  border-bottom:1px solid var(--linea);
  overflow:hidden;
  position:relative;
}

.badge-sinstock{
  position:absolute;
  top:8px; left:8px;
  background:var(--coral-oscuro);
  color:white;
  font-size:10.5px;
  font-weight:700;
  padding:3px 8px;
  border-radius:6px;
  z-index:2;
}

.badge-stockbajo{
  position:absolute;
  top:8px; left:8px;
  background:#C77D00;
  color:white;
  font-size:10.5px;
  font-weight:700;
  padding:3px 8px;
  border-radius:6px;
  z-index:2;
}

.badge-destacado{
  position:absolute;
  top:8px; right:8px;
  background:#F0A63A;
  color:#3A2600;
  font-size:10.5px;
  font-weight:700;
  padding:3px 8px;
  border-radius:6px;
  z-index:2;
}

.producto.sin-stock .foto-producto{ opacity:.45; }
.producto.sin-stock .nombre-producto,
.producto.sin-stock .precio{ color:var(--texto-suave); }

.galeria-img{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.flecha{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:26px; height:26px;
  border-radius:50%;
  border:none;
  background:rgba(18,26,22,.55);
  color:white;
  font-size:16px;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:3;
}
.flecha-izq{ left:6px; }
.flecha-der{ right:6px; }
.flecha:hover{ background:rgba(18,26,22,.8); }

.puntos-img{
  position:absolute;
  bottom:8px;
  left:0; right:0;
  display:flex;
  justify-content:center;
  gap:5px;
  z-index:3;
}
.punto{
  width:6px; height:6px;
  border-radius:50%;
  background:rgba(255,255,255,.6);
  cursor:pointer;
}
.punto.activo{ background:white; }

.foto-producto img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.emoji-respaldo{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
}

.datos-producto{
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:4px;
  flex:1;
}

.nombre-producto{
  font-weight:600;
  font-size:14.5px;
  line-height:1.3;
}

.desc-producto{
  font-size:12.5px;
  color:var(--texto-suave);
  flex:1;
}

.unidad-precio{
  font-size:11px;
  font-weight:600;
  color:var(--texto-suave);
  margin-left:2px;
}

.fila-precio{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:8px;
}

.precio{
  font-family:'Sora', sans-serif;
  font-weight:700;
  font-size:16.5px;
  color:var(--verde-oscuro);
}

.btn-agregar{
  background:var(--verde-hoja);
  color:white;
  border:none;
  border-radius:10px;
  padding:7px 12px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}
.btn-agregar:hover{ background:var(--verde-oscuro); }
.btn-agregar:disabled{
  background:#D8DBD5;
  color:var(--texto-suave);
  cursor:not-allowed;
}

/* ---------- Carrito lateral ---------- */

.fondo-oscuro{
  position:fixed; inset:0;
  background:rgba(18,26,22,.45);
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease;
  z-index:20;
}
.fondo-oscuro.abierto{ opacity:1; pointer-events:auto; }

.panel-carrito{
  position:fixed;
  top:0; right:0;
  height:100%;
  width:min(420px, 100%);
  background:var(--papel);
  z-index:21;
  transform:translateX(100%);
  transition:transform .25s ease;
  display:flex;
  flex-direction:column;
}
.panel-carrito.abierto{ transform:translateX(0); }

.panel-header{
  padding:18px 20px;
  border-bottom:1px solid var(--linea);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.panel-header h2{ font-size:18px; }

.cerrar{
  background:none;
  border:none;
  font-size:22px;
  cursor:pointer;
  color:var(--texto-suave);
  line-height:1;
}

.panel-body{
  flex:1;
  overflow-y:auto;
  padding:16px 20px;
}

.vacio{
  color:var(--texto-suave);
  font-size:14px;
  text-align:center;
  margin-top:40px;
}

.item-carrito{
  display:flex;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--linea);
  align-items:center;
}

.item-icono{
  width:44px; height:44px;
  border-radius:10px;
  background:var(--crema);
  display:flex; align-items:center; justify-content:center;
  font-size:22px;
  flex-shrink:0;
}

.item-info{ flex:1; }
.item-nombre{ font-weight:600; font-size:13.5px; }
.item-precio-unit{ font-size:12px; color:var(--texto-suave); margin-top:2px; }

.stepper{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:6px;
}
.stepper button{
  width:24px; height:24px;
  border-radius:6px;
  border:1px solid var(--linea);
  background:var(--papel);
  cursor:pointer;
  font-size:14px;
  line-height:1;
}
.stepper span{ font-size:13.5px; font-weight:600; min-width:16px; text-align:center; }

.input-cantidad{
  width:40px;
  text-align:center;
  font-size:13.5px;
  font-weight:600;
  font-family:'Karla', sans-serif;
  border:1px solid var(--linea);
  border-radius:6px;
  padding:3px 2px;
  color:var(--texto);
}
.input-cantidad:focus{
  outline:none;
  border-color:var(--verde-hoja);
}
.sufijo-cantidad{
  font-size:12px;
  color:var(--texto-suave);
}

.quitar{
  background:none;
  border:none;
  color:var(--coral-oscuro);
  font-size:12px;
  cursor:pointer;
  text-decoration:underline;
  margin-top:4px;
}

.panel-footer{
  border-top:1px solid var(--linea);
  padding:16px 20px 20px;
}

.fila-subtotal{
  display:flex;
  justify-content:space-between;
  font-size:15px;
  font-weight:700;
  margin-bottom:12px;
}

.btn-continuar{
  width:100%;
  background:var(--coral);
  color:white;
  border:none;
  border-radius:12px;
  padding:13px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  font-family:'Karla', sans-serif;
}
.btn-continuar:hover{ background:var(--coral-oscuro); }
.btn-continuar:disabled{ background:#C9CFC8; cursor:not-allowed; }

.btn-secundario{
  width:100%;
  background:none;
  color:var(--verde-hoja);
  border:1px solid var(--linea);
  border-radius:12px;
  padding:11px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  font-family:'Karla', sans-serif;
  margin-top:8px;
}
.btn-secundario:hover{ background:var(--crema); }

/* ---------- Formulario de pedido ---------- */

.campo{ margin-bottom:14px; }
.campo label{
  display:block;
  font-size:12.5px;
  font-weight:600;
  color:var(--texto-suave);
  margin-bottom:5px;
}
.campo input, .campo textarea{
  width:100%;
  border:1px solid var(--linea);
  border-radius:9px;
  padding:9px 11px;
  font-family:'Karla', sans-serif;
  font-size:14px;
  color:var(--texto);
}
.campo textarea{ resize:vertical; min-height:60px; }

.opciones-entrega{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}
.opcion-entrega{
  flex:1;
  border:1px solid var(--linea);
  border-radius:10px;
  padding:10px;
  text-align:center;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  color:var(--texto-suave);
}
.opcion-entrega.activo{
  border-color:var(--verde-hoja);
  background:#EAF2EE;
  color:var(--verde-oscuro);
}

.volver{
  background:none;
  border:none;
  color:var(--verde-hoja);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  margin-bottom:14px;
}

.aviso-envio{
  font-size:12px;
  color:var(--texto-suave);
  background:var(--crema);
  border-radius:8px;
  padding:9px 11px;
  margin-bottom:14px;
}

.aviso-alerta{
  background:#FBEAE3;
  color:var(--coral-oscuro);
  font-weight:600;
}

.confirmacion{
  text-align:center;
  padding:30px 10px;
}
.confirmacion-icono{
  font-size:52px;
  margin-bottom:14px;
}
.confirmacion-texto{
  font-size:14px;
  color:var(--texto-suave);
  line-height:1.5;
}

/* ---------- Modal de variantes (tamaños/presentaciones) ---------- */

.modal-variantes{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%, -46%);
  width:min(380px, 90%);
  max-height:80vh;
  background:var(--papel);
  border-radius:16px;
  z-index:26;
  opacity:0;
  pointer-events:none;
  overflow-y:auto;
  transition:opacity .2s ease, transform .2s ease;
  display:flex;
  flex-direction:column;
}
.modal-variantes.abierto{
  opacity:1;
  transform:translate(-50%, -50%);
  pointer-events:auto;
}

.modal-variantes-header{
  padding:16px 18px;
  border-bottom:1px solid var(--linea);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.modal-variantes-header h3{
  font-size:16px;
  line-height:1.3;
}

.modal-variantes-body{
  padding:16px 18px 18px;
}

.modal-variantes-desc{
  font-size:13px;
  color:var(--texto-suave);
  margin-bottom:12px;
}

.lista-variantes{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:16px;
}

.fila-variante{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:1px solid var(--linea);
  border-radius:10px;
  padding:11px 13px;
  cursor:pointer;
  transition:border-color .15s ease, background .15s ease;
}
.fila-variante.activo{
  border-color:var(--verde-hoja);
  background:#EAF2EE;
}
.variante-nombre{
  font-size:13.5px;
  font-weight:600;
}
.variante-precio{
  font-family:'Sora', sans-serif;
  font-weight:700;
  font-size:14px;
  color:var(--verde-oscuro);
}

.precio-desde{
  font-size:11px;
  font-weight:600;
  color:var(--texto-suave);
  display:block;
}

.datos-transferencia{
  background:var(--crema);
  border-radius:10px;
  padding:12px 14px;
  margin-bottom:14px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.fila-dato-transferencia{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.etiqueta-dato{
  display:block;
  font-size:11px;
  font-weight:700;
  color:var(--texto-suave);
  text-transform:uppercase;
  letter-spacing:.03em;
}

.valor-dato{
  display:block;
  font-family:'Sora', sans-serif;
  font-size:17px;
  font-weight:700;
  color:var(--verde-oscuro);
  word-break:break-all;
}

.btn-copiar{
  background:var(--papel);
  border:1px solid var(--linea);
  color:var(--verde-hoja);
  font-size:12px;
  font-weight:700;
  padding:7px 12px;
  border-radius:8px;
  cursor:pointer;
  flex-shrink:0;
  white-space:nowrap;
}
.btn-copiar:hover{ background:var(--verde-hoja); color:white; }
.btn-copiar.copiado{ background:var(--verde-hoja); border-color:var(--verde-hoja); color:white; }

@media (max-width:480px){
  .header-top{ flex-direction:column; }
  .btn-carrito{ align-self:flex-start; }
}
</style>
</head>
<body>

<div class="aviso-cargando-stock" id="avisoCargandoStock">🔄 Actualizando disponibilidad...</div>

<header class="tienda">
  <div class="header-inner">

/* ======================================================================
   A PARTIR DE ACÁ ES EL FUNCIONAMIENTO DEL CATÁLOGO.
   No hace falta tocar nada de lo que sigue.
   ====================================================================== */

document.getElementById("nombreTienda").textContent = TIENDA.nombre;
document.getElementById("descTienda").textContent = TIENDA.descripcion;
document.title = "Catálogo " + TIENDA.nombre;

let carrito = [];
try{
  const guardado = localStorage.getItem("carrito_" + TIENDA.nombre);
  if(guardado) carrito = JSON.parse(guardado);
}catch(e){ carrito = []; }

let categoriaActiva = "Todos";
let textoBusqueda = "";
let vistaCarrito = "lista"; // "lista" | "formulario"
let entregaElegida = "retiro"; // "retiro" | "envio"
let formaPagoElegida = "efectivo"; // "efectivo" | "transferencia"
// Acá se guarda lo que el cliente va escribiendo en el formulario, para que
// no se pierda si cambia de "retiro" a "envío" (o de forma de pago) y la
// pantalla se vuelve a dibujar.
let datosFormulario = { nombre:"", telefono:"", direccion:"", notas:"" };

function guardarCarrito(){
  try{ localStorage.setItem("carrito_" + TIENDA.nombre, JSON.stringify(carrito)); }catch(e){}
}

function formatoPrecio(numero){
  return "$" + numero.toLocaleString("es-AR");
}

// ---------- Categorías ----------
function pintarCategorias(){
  const cont = document.getElementById("categorias");
  cont.innerHTML = "";
  CATEGORIAS.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (cat === categoriaActiva ? " activo" : "");
    btn.textContent = cat;
    btn.onclick = () => { categoriaActiva = cat; pintarCategorias(); pintarProductos(); };
    cont.appendChild(btn);
  });
}

// ---------- Grilla de productos ----------
function pintarProductos(){
  const cont = document.getElementById("grillaProductos");
  cont.innerHTML = "";

  const lista = PRODUCTOS.filter(p => {
    if(textoBusqueda){
      // Mientras se está buscando, se busca en TODO el catálogo,
      // sin importar qué categoría esté seleccionada.
      return p.nombre.toLowerCase().includes(textoBusqueda) ||
             (p.desc || "").toLowerCase().includes(textoBusqueda);
    }
    if(categoriaActiva === "Destacados"){
      return p.destacado === true;
    }
    return categoriaActiva === "Todos" || p.categoria === categoriaActiva;
  });

  if(lista.length === 0){
    cont.innerHTML = `<p class="sin-resultados">No encontramos productos que coincidan con "${textoBusqueda}".</p>`;
    return;
  }

  lista.forEach(p => {
    const sinStock = typeof p.stock === "number" ? p.stock <= 0 : p.stock === false;
    const stockBajo = typeof p.stock === "number" && p.stock > 0 && p.stock <= TIENDA.umbralStockBajo;
    const tieneVariantes = p.variantes && p.variantes.length > 0;
    // Lista de fotos del producto: si tiene "imagenes" (varias), se usa esa.
    // Si no, y tiene "imagen" (una sola), se usa como lista de un solo elemento.
    const imagenes = (p.imagenes && p.imagenes.length) ? p.imagenes : (p.imagen ? [p.imagen] : []);

    const card = document.createElement("div");
    card.className = "producto" + (sinStock ? " sin-stock" : "");

    const precioMasBajo = tieneVariantes ? Math.min(...p.variantes.map(v => v.precio)) : p.precio;

    card.innerHTML = `
      <div class="foto-producto">
        ${sinStock ? '<span class="badge-sinstock">Sin stock</span>' : ""}
        ${!sinStock && stockBajo ? `<span class="badge-stockbajo">¡Últimas ${p.stock}!</span>` : ""}
        ${p.destacado ? '<span class="badge-destacado">⭐ Destacado</span>' : ""}
        <div class="galeria-img"></div>
        ${imagenes.length > 1 ? `
          <button class="flecha flecha-izq" type="button" aria-label="Foto anterior">‹</button>
          <button class="flecha flecha-der" type="button" aria-label="Foto siguiente">›</button>
          <div class="puntos-img">${imagenes.map((_, i) => `<span class="punto" data-i="${i}"></span>`).join("")}</div>
        ` : ""}
      </div>
      <div class="datos-producto">
        <div class="nombre-producto">${p.nombre}</div>
        <div class="desc-producto">${p.desc || ""}</div>
        <div class="fila-precio">
          <span class="precio">
            ${tieneVariantes ? `<span class="precio-desde">Desde</span>${formatoPrecio(precioMasBajo)}` : `${formatoPrecio(p.precio)}${p.porPeso ? '<span class="unidad-precio">/kg</span>' : ""}`}
          </span>
          <button class="btn-agregar" ${sinStock ? "disabled" : ""}>${sinStock ? "Sin stock" : (tieneVariantes ? "Ver opciones" : "Agregar")}</button>
        </div>
      </div>
    `;

    // ---- Lógica de la galería de fotos de esta tarjeta ----
    let indiceImg = 0;
    const contenedorImg = card.querySelector(".galeria-img");

    function pintarImagenActual(){
      contenedorImg.innerHTML = imagenes.length
        ? `<img src="${imagenes[indiceImg]}" alt="${p.nombre}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'emoji-respaldo',textContent:'${p.icono}'}))">`
        : `<div class="emoji-respaldo">${p.icono}</div>`;
      card.querySelectorAll(".punto").forEach((pt, i) => pt.classList.toggle("activo", i === indiceImg));
    }
    pintarImagenActual();

    if(imagenes.length > 1){
      card.querySelector(".flecha-izq").onclick = () => {
        indiceImg = (indiceImg - 1 + imagenes.length) % imagenes.length;
        pintarImagenActual();
      };
      card.querySelector(".flecha-der").onclick = () => {
        indiceImg = (indiceImg + 1) % imagenes.length;
        pintarImagenActual();
      };
      card.querySelectorAll(".punto").forEach(pt => {
        pt.onclick = () => { indiceImg = parseInt(pt.dataset.i); pintarImagenActual(); };
      });
    }

    if(!sinStock){
      card.querySelector(".btn-agregar").onclick = () => {
        if(tieneVariantes){ abrirSelectorVariantes(p); }
        else{ agregarAlCarrito(p); }
      };
    }
    cont.appendChild(card);
  });
}

// ---------- Lógica del carrito ----------
// Cada línea del carrito se identifica por "idCarrito", no por "id" del
// producto: así, dos variantes del mismo producto (ej. bandeja chica y
// bandeja grande) quedan como líneas separadas en vez de mezclarse.
function agregarAlCarrito(producto){
  const idCarrito = String(producto.id);
  const existente = carrito.find(i => i.idCarrito === idCarrito);
  if(existente){
    existente.cantidad = producto.porPeso ? existente.cantidad + (producto.pasoPesoKg || 0.1) : existente.cantidad + 1;
  }else{
    const cantidadInicial = producto.porPeso ? (producto.minimoPesoKg || 0.5) : 1;
    carrito.push({ ...producto, idCarrito, cantidad: cantidadInicial });
  }
  guardarCarrito();
  actualizarBadge();
  pulsarBadges();
}

function pulsarBadges(){
  [document.getElementById("cantidadCarrito"), document.getElementById("cantidadCarritoFlotante")].forEach(el => {
    el.classList.remove("pulso");
    void el.offsetWidth; // fuerza a reiniciar la animación aunque se toque seguido
    el.classList.add("pulso");
  });
}

function cambiarCantidad(idCarrito, delta){
  const item = carrito.find(i => i.idCarrito === idCarrito);
  if(!item) return;
  const paso = item.porPeso ? (item.pasoPesoKg || 0.1) : 1;
  const minimo = item.porPeso ? (item.minimoPesoKg || 0.5) : 1;
  const nuevaCantidad = Math.round((item.cantidad + delta * paso) * 1000) / 1000;
  if(delta < 0 && nuevaCantidad < minimo){
    // Con los botones no se baja del mínimo de venta; para eso está "Quitar".
    item.cantidad = minimo;
  }else if(nuevaCantidad <= 0){
    carrito = carrito.filter(i => i.idCarrito !== idCarrito);
  }else{
    item.cantidad = nuevaCantidad;
  }
  guardarCarrito();
  actualizarBadge();
  pintarPanelCarrito();
}

function formatoCantidad(item){
  return item.porPeso ? `${item.cantidad} kg` : item.cantidad;
}

function hayProductoPorPeso(){
  return carrito.some(i => i.porPeso);
}

// ---------- Selector de variantes (tamaños/presentaciones) ----------
let productoEnSeleccion = null;
let varianteSeleccionada = 0;

function abrirSelectorVariantes(producto){
  productoEnSeleccion = producto;
  varianteSeleccionada = 0;
  document.getElementById("fondoVariantes").classList.add("abierto");
  document.getElementById("modalVariantes").classList.add("abierto");
  pintarModalVariantes();
}

function cerrarSelectorVariantes(){
  document.getElementById("fondoVariantes").classList.remove("abierto");
  document.getElementById("modalVariantes").classList.remove("abierto");
}

function pintarModalVariantes(){
  const p = productoEnSeleccion;
  document.getElementById("modalVariantesTitulo").textContent = p.nombre;
  const body = document.getElementById("modalVariantesBody");

  body.innerHTML = `
    ${p.desc ? `<p class="modal-variantes-desc">${p.desc}</p>` : ""}
    <div class="lista-variantes">
      ${p.variantes.map((v, i) => `
        <div class="fila-variante ${i === varianteSeleccionada ? "activo" : ""}" data-index="${i}">
          <span class="variante-nombre">${v.nombre}</span>
          <span class="variante-precio">${formatoPrecio(v.precio)}</span>
        </div>
      `).join("")}
    </div>
    <button class="btn-continuar" id="btnAgregarVariante">Agregar al carrito — ${formatoPrecio(p.variantes[varianteSeleccionada].precio)}</button>
  `;

  body.querySelectorAll(".fila-variante").forEach(fila => {
    fila.onclick = () => {
      varianteSeleccionada = parseInt(fila.dataset.index);
      pintarModalVariantes();
    };
  });
  document.getElementById("btnAgregarVariante").onclick = agregarVarianteAlCarrito;
}

function agregarVarianteAlCarrito(){
  const p = productoEnSeleccion;
  const v = p.variantes[varianteSeleccionada];
  const idCarrito = `${p.id}-v${varianteSeleccionada}`;

  const existente = carrito.find(i => i.idCarrito === idCarrito);
  if(existente){ existente.cantidad += 1; }
  else{
    carrito.push({
      ...p,
      idCarrito,
      nombre: `${p.nombre} — ${v.nombre}`,
      precio: v.precio,
      variantes: undefined,
      cantidad: 1
    });
  }
  guardarCarrito();
  actualizarBadge();
  pulsarBadges();
  cerrarSelectorVariantes();
}

// ---------- Horario de atención ----------
const DIAS_SEMANA = ["domingo", "lunes", "martes", "miercoles", "jueves", "viernes", "sabado"];

function estaAbierto(fecha = new Date()){
  const diaKey = DIAS_SEMANA[fecha.getDay()];
  const franjas = TIENDA.horarios[diaKey] || [];
  const minutosAhora = fecha.getHours() * 60 + fecha.getMinutes();
  return franjas.some(([desde, hasta]) => {
    const [hD, mD] = desde.split(":").map(Number);
    const [hH, mH] = hasta.split(":").map(Number);
    return minutosAhora >= (hD * 60 + mD) && minutosAhora < (hH * 60 + mH);
  });
}

// ---------- Stock en vivo (opcional, vía Google Sheets) ----------
async function sincronizarStockEnVivo(){
  if(!TIENDA.stockEnVivoUrl) return; // función apagada si no se configuró nada

  const aviso = document.getElementById("avisoCargandoStock");
  if(aviso) aviso.classList.add("visible");

  try{
    const respuesta = await fetch(TIENDA.stockEnVivoUrl, { cache: "no-store" });
    if(!respuesta.ok) throw new Error("La planilla de stock no respondió correctamente.");

    const textoCSV = await respuesta.text();
    const filas = textoCSV.trim().split("\n").slice(1); // se saltea la fila de encabezados

    filas.forEach(fila => {
      const columnas = fila.split(",").map(c => c.replace(/"/g, "").trim());
      const idProducto = parseInt(columnas[0]);
      const stockNuevo = parseFloat(columnas[1]);
      const producto = PRODUCTOS.find(p => p.id === idProducto);
      if(producto && !isNaN(stockNuevo)){
        producto.stock = stockNuevo;
      }
    });

    pintarProductos(); // vuelve a dibujar la grilla con el stock recién llegado
  }catch(error){
    // Si algo falla (sin internet, la planilla no está publicada, etc.), no
    // se rompe nada: el catálogo sigue mostrando el stock que ya tenía
    // escrito en el código, como si esta función no existiera.
    console.warn("No se pudo actualizar el stock en vivo, se sigue usando el del código:", error);
  }finally{
    if(aviso) aviso.classList.remove("visible");
  }
}

// Días en el orden en que se muestran (arranca en lunes, como se usa en
// Argentina), armado a partir de los mismos horarios de TIENDA.horarios,
// para no tener que escribir el horario dos veces en lugares distintos.
const ORDEN_DIAS_VISIBLE = ["lunes", "martes", "miercoles", "jueves", "viernes", "sabado", "domingo"];
const NOMBRE_DIA = { lunes:"Lunes", martes:"Martes", miercoles:"Miércoles", jueves:"Jueves", viernes:"Viernes", sabado:"Sábado", domingo:"Domingo" };

function pintarDetalleHorario(){
  const cont = document.getElementById("detalleHorario");
  cont.innerHTML = ORDEN_DIAS_VISIBLE.map(dia => {
    const franjas = TIENDA.horarios[dia] || [];
    const texto = franjas.length ? franjas.map(([d, h]) => `${d} a ${h}`).join(" y ") : "Cerrado";
    return `<div class="fila-horario"><span>${NOMBRE_DIA[dia]}</span><span>${texto}</span></div>`;
  }).join("");
}

// Filtros para los campos del formulario.
function soloLetras(texto){
  return texto.replace(/[^A-Za-zÀ-ÿñÑ\s]/g, "");
}
function soloNumeros(texto){
  return texto.replace(/[^0-9]/g, "");
}

function hayDatosTransferencia(){
  return TIENDA.datosTransferencia && (TIENDA.datosTransferencia.alias || TIENDA.datosTransferencia.cbu);
}

function activarBotonesCopiar(contenedor){
  contenedor.querySelectorAll(".btn-copiar").forEach(btn => {
    btn.onclick = () => {
      const texto = btn.dataset.copiar;
      const avisarCopiado = () => {
        const textoOriginal = "Copiar";
        btn.textContent = "¡Copiado!";
        btn.classList.add("copiado");
        setTimeout(() => { btn.textContent = textoOriginal; btn.classList.remove("copiado"); }, 1500);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(texto).then(avisarCopiado).catch(() => copiarConFallback(texto, avisarCopiado));
      }else{
        copiarConFallback(texto, avisarCopiado);
      }
    };
  });
}

function copiarConFallback(texto, callback){
  const temporal = document.createElement("textarea");
  temporal.value = texto;
  temporal.style.position = "fixed";
  temporal.style.opacity = "0";
  document.body.appendChild(temporal);
  temporal.select();
  try{ document.execCommand("copy"); callback(); }catch(e){}
  document.body.removeChild(temporal);
}

// Texto que se muestra cuando hay productos por peso en el carrito.
// Se puede editar libremente el redactado sin romper nada.
const AVISO_PESO = "⚖️ Los productos que se venden por peso se cobran según lo que marque la balanza al pesarlos: el monto puede ajustarse un poco respecto a lo que ves acá.";

function quitarDelCarrito(idCarrito){
  carrito = carrito.filter(i => i.idCarrito !== idCarrito);
  guardarCarrito();
  actualizarBadge();
  pintarPanelCarrito();
}

function subtotalCarrito(){
  return carrito.reduce((acc, i) => acc + i.precio * i.cantidad, 0);
}

function cantidadTotalCarrito(){
  return carrito.length;
}

function actualizarBadge(){
  const cantidad = cantidadTotalCarrito();
  document.getElementById("cantidadCarrito").textContent = cantidad;
  document.getElementById("cantidadCarritoFlotante").textContent = cantidad;
}

// ---------- Panel lateral ----------
function abrirCarrito(){
  vistaCarrito = "lista";
  document.getElementById("fondoOscuro").classList.add("abierto");
  document.getElementById("panelCarrito").classList.add("abierto");
  pintarPanelCarrito();
}

function cerrarCarrito(){
  document.getElementById("fondoOscuro").classList.remove("abierto");
  document.getElementById("panelCarrito").classList.remove("abierto");
}

function pintarPanelCarrito(){
  if(vistaCarrito === "lista"){ pintarVistaLista(); }
  else if(vistaCarrito === "confirmacion"){ pintarVistaConfirmacion(); }
  else{ pintarVistaFormulario(); }
}

function pintarVistaLista(){
  document.getElementById("tituloPanel").textContent = "Tu pedido";
  const cuerpo = document.getElementById("cuerpoPanel");
  const pie = document.getElementById("piePanel");

  if(carrito.length === 0){
    cuerpo.innerHTML = `<p class="vacio">Todavía no agregaste productos.</p>`;
    pie.innerHTML = "";
    return;
  }

  cuerpo.innerHTML = carrito.map(i => `
    <div class="item-carrito">
      <div class="item-icono">${i.icono}</div>
      <div class="item-info">
        <div class="item-nombre">${i.nombre}</div>
        <div class="item-precio-unit">${formatoPrecio(i.precio)} ${i.porPeso ? "por kg" : "c/u"}</div>
        <div class="stepper">
          <button onclick="cambiarCantidad('${i.idCarrito}', -1)">−</button>
          <input type="text" inputmode="decimal" class="input-cantidad" data-idcarrito="${i.idCarrito}" value="${i.cantidad}">
          ${i.porPeso ? '<span class="sufijo-cantidad">kg</span>' : ""}
          <button onclick="cambiarCantidad('${i.idCarrito}', 1)">+</button>
        </div>
        <button class="quitar" onclick="quitarDelCarrito('${i.idCarrito}')">Quitar</button>
      </div>
    </div>
  `).join("");

  // Además de los botones +/-, el cliente puede escribir la cantidad a mano
  // (útil, por ejemplo, para pedidos grandes al por mayor).
  cuerpo.querySelectorAll(".input-cantidad").forEach(input => {
    input.onchange = e => {
      const idCarrito = e.target.dataset.idcarrito;
      const item = carrito.find(i => i.idCarrito === idCarrito);
      if(!item) return;
      const valor = parseFloat(e.target.value.replace(",", "."));
      if(isNaN(valor) || valor <= 0){
        carrito = carrito.filter(i => i.idCarrito !== idCarrito);
      }else{
        item.cantidad = item.porPeso ? Math.round(valor * 1000) / 1000 : Math.round(valor);
      }
      guardarCarrito();
      actualizarBadge();
      pintarPanelCarrito();
    };
  });

  pie.innerHTML = `
    ${hayProductoPorPeso() ? `<div class="aviso-envio">${AVISO_PESO}</div>` : ""}
    <div class="fila-subtotal">
      <span>Subtotal</span>
      <span>${formatoPrecio(subtotalCarrito())}</span>
    </div>
    <button class="btn-continuar" id="btnContinuar">Finalizar pedido</button>
    <button class="btn-secundario" id="btnSeguirComprando">Seguir comprando</button>
  `;
  document.getElementById("btnContinuar").onclick = () => {
    vistaCarrito = "formulario";
    pintarPanelCarrito();
  };
  document.getElementById("btnSeguirComprando").onclick = cerrarCarrito;
}

  document.getElementById("tituloPanel").textContent = "Tus datos";
  const cuerpo = document.getElementById("cuerpoPanel");
  const pie = document.getElementById("piePanel");

  cuerpo.innerHTML = `
    <button class="volver" id="btnVolver">← Volver al pedido</button>

    ${!estaAbierto() ? '<div class="aviso-envio">🕒 En este momento el comercio está cerrado. Tu pedido queda guardado y te van a responder ni bien vuelvan a abrir.</div>' : ""}

    <div class="opciones-entrega">
      <div class="opcion-entrega ${entregaElegida === 'retiro' ? 'activo' : ''}" id="optRetiro">🏪 Retiro en el local</div>
      <div class="opcion-entrega ${entregaElegida === 'envio' ? 'activo' : ''}" id="optEnvio">🚚 Envío a domicilio</div>

    ${entregaElegida === 'envio' && TIENDA.pedidoMinimoEnvio > 0 && subtotalCarrito() < TIENDA.pedidoMinimoEnvio ? `
    <div class="aviso-envio aviso-alerta">⚠️ El pedido mínimo para envío a domicilio es ${formatoPrecio(TIENDA.pedidoMinimoEnvio)}. Te faltan ${formatoPrecio(TIENDA.pedidoMinimoEnvio - subtotalCarrito())} — agregá algún producto más o elegí retiro en el local.</div>` : ""}

    <div class="opciones-entrega">
      <div class="opcion-entrega ${formaPagoElegida === 'efectivo' ? 'activo' : ''}" id="optEfectivo">💵 Efectivo</div>
      ${hayDatosTransferencia() ? `<div class="opcion-entrega ${formaPagoElegida === 'transferencia' ? 'activo' : ''}" id="optTransferencia">🏦 Transferencia</div>` : ""}
    </div>

    ${formaPagoElegida === 'transferencia' && hayDatosTransferencia() ? `
    <div class="datos-transferencia">
      ${TIENDA.datosTransferencia.alias ? `
      <div class="fila-dato-transferencia">
        <div><span class="etiqueta-dato">Alias</span><span class="valor-dato">${TIENDA.datosTransferencia.alias}</span></div>

      <div class="fila-dato-transferencia">
        <div><span class="etiqueta-dato">CBU</span><span class="valor-dato">${TIENDA.datosTransferencia.cbu}</span></div>
        <button class="btn-copiar" type="button" data-copiar="${TIENDA.datosTransferencia.cbu}">Copiar</button>
      </div>` : ""}
      ${TIENDA.datosTransferencia.titular ? `
      <div class="fila-dato-transferencia">
        <div><span class="etiqueta-dato">Titular</span><span class="valor-dato">${TIENDA.datosTransferencia.titular}</span></div>
      </div>` : ""}
    </div>
    <div class="aviso-envio">📎 Después de transferir, compartí el comprobante con el comercio por este mismo WhatsApp.</div>
    ` : ""}

    <div class="campo">

      <input type="text" id="campoNombre" placeholder="Tu nombre" value="${datosFormulario.nombre}">
    </div>
    <div class="campo">
      <label>Teléfono</label>
      <input type="tel" id="campoTelefono" placeholder="Tu número de contacto" value="${datosFormulario.telefono}">
    </div>
    ${entregaElegida === 'envio' ? `
    <div class="campo">
      <label>Dirección de entrega</label>

// ---------- Armado y envío del mensaje de WhatsApp ----------
let ultimoLinkWhatsapp = "";

function enviarPedidoPorWhatsapp(){
  const nombre = datosFormulario.nombre.trim();
  const telefono = datosFormulario.telefono.trim();
  const direccion = entregaElegida === "envio" ? datosFormulario.direccion.trim() : "";
  const notas = datosFormulario.notas.trim();

  if(!nombre || !telefono){
    alert("Por favor completá al menos tu nombre y tu teléfono.");
    return;
  }
  if(entregaElegida === "envio" && !direccion){
    alert("Por favor completá la dirección de entrega.");
    return;
  }
  if(entregaElegida === "envio" && TIENDA.pedidoMinimoEnvio > 0 && subtotalCarrito() < TIENDA.pedidoMinimoEnvio){
    alert(`El pedido mínimo para envío a domicilio es ${formatoPrecio(TIENDA.pedidoMinimoEnvio)}. Agregá algún producto más o elegí retiro en el local.`);
    return;
  }

  let mensaje = `Hola ${TIENDA.nombre}! Quiero hacer este pedido:%0A%0A`;

  carrito.forEach(i => {
    mensaje += `• ${formatoCantidad(i)} x ${i.nombre} — ${formatoPrecio(i.precio * i.cantidad)}%0A`;
  });

  mensaje += `%0ATotal de la compra${hayProductoPorPeso() ? " (puede ajustarse al pesar)" : ""}: ${formatoPrecio(subtotalCarrito())}%0A%0A`;
  mensaje += `Modalidad: ${entregaElegida === "envio" ? "Envío a domicilio" : "Retiro en el local"}%0A`;
  mensaje += `Forma de pago: ${formaPagoElegida === "transferencia" ? "Transferencia" : "Efectivo"}%0A`;
  if(formaPagoElegida === "transferencia"){
    mensaje += `(Voy a compartir el comprobante por acá)%0A`;
  }
  mensaje += `Nombre: ${nombre}%0A`;
  mensaje += `Teléfono: ${telefono}%0A`;
  if(direccion) mensaje += `Dirección: ${direccion}%0A`;
  if(notas) mensaje += `Notas: ${notas}%0A`;

  ultimoLinkWhatsapp = `https://wa.me/${TIENDA.whatsapp}?text=${mensaje}`;
  window.open(ultimoLinkWhatsapp, "_blank");

  carrito = [];
  guardarCarrito();
  actualizarBadge();
  datosFormulario = { nombre:"", telefono:"", direccion:"", notas:"" };
  vistaCarrito = "confirmacion";
  pintarPanelCarrito();
}

  document.getElementById("btnListoConfirmacion").onclick = () => {
    vistaCarrito = "lista";
    cerrarCarrito();
  };
}

// ---------- Eventos generales ----------
document.getElementById("btnAbrirCarrito").onclick = abrirCarrito;
document.getElementById("btnCerrarCarrito").onclick = cerrarCarrito;
document.getElementById("fondoOscuro").onclick = cerrarCarrito;
document.getElementById("btnCerrarVariantes").onclick = cerrarSelectorVariantes;
document.getElementById("fondoVariantes").onclick = cerrarSelectorVariantes;
document.getElementById("buscador").addEventListener("input", (e) => {
  textoBusqueda = e.target.value.trim().toLowerCase();
  pintarProductos();
});

// Botón de carrito flotante: aparece recién después de scrollear un poco,
// para no tapar el encabezado ni el botón de carrito de ahí arriba.
const fabCarrito = document.getElementById("fabCarrito");
fabCarrito.onclick = abrirCarrito;
function actualizarVisibilidadFab(){
  if(window.scrollY > 220){ fabCarrito.classList.add("visible"); }
  else{ fabCarrito.classList.remove("visible"); }
}
window.addEventListener("scroll", actualizarVisibilidadFab);
actualizarVisibilidadFab();

// ---------- Arranque ----------
pintarCategorias();
pintarProductos();
actualizarBadge();
pintarChipHorario();
setInterval(pintarChipHorario, 60000);
pintarDetalleHorario();
document.getElementById("chipHorario").onclick = () => {
  document.getElementById("detalleHorario").classList.toggle("abierto");
};
sincronizarStockEnVivo();
</script>

</body>
</html>
